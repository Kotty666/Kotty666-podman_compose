# Example Hiera using profile::podman_projects.
#
# The literal token 'harbor' is replaced at catalog compile time with
# the value returned by environment::get_environment('harbor').
# HTTP_PROXY/HTTPS_PROXY/NO_PROXY are injected into env_vars from
# environment::get_http_proxy().
#
# File location: hieradata/nodes/<fqdn>.yaml
---
classes:
  - profile::podman_projects

profile::podman_projects::cron_projects:

  # Sync container, runs at 04:05, 12:05 and 16:05 every day.
  help-sync:
    user: helpsync
    rootless: true
    on_calendar: '*-*-* 04,12,16:05:00'
    randomized_delay_sec: '2min'
    run_service: sync
    pull_before_run: true
    registries:
      harbor/help:
        username: deploy
        password: ENC[PKCS7,MIIBmQYJKoZIhvcN...]
    # AZ is sourced from a web frontend as a single comma- or
    # whitespace-separated string. expand_splat() turns the
    # `<<splat:AZ>>` token below into separate argv elements, so the
    # container runs:
    #   python main.py -id 1111… 2222… 3333…
    env_vars:
      AZ: "11111111-1111-1111-1111-111111111111, 22222222-2222-2222-2222-222222222222 33333333-3333-3333-3333-333333333333"
    compose:
      services:
        sync:
          image: "harbor/help/sync:latest"
          command:
            - "python"
            - "main.py"
            - "-id"
            # `<<splat:...>>` is deliberately not Hiera interpolation syntax,
            # so the profile function can consume it directly.
            - "<<splat:AZ>>"
          env_file:
            - .env
